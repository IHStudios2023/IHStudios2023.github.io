name: Supabase keep-alive
on:
  schedule:
    - cron: "0 13 * * *"   # daily, 9 AM Eastern
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query scores table
        run: |
          curl -sS --fail "https://dzidkpoomkgulkcyrzdf.supabase.co/rest/v1/scores?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
      - name: Record run
        run: |
          date -u > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
